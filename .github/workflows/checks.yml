name: Checks

# Package build, lintian, lint and (where available) unit tests on every pull
# request. The jobs are shared with the other linuxmuster repositories, see
# .github/workflows/lmn-checks.yml in edulution-io/edulution-package-server.

on:
  pull_request:
  push:
    branches: [bionic]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    uses: edulution-io/edulution-package-server/.github/workflows/lmn-checks.yml@edulution/lmn-checks
    with:
      build-runner: ubuntu-24.04
      build-setup: sudo apt-get update && sudo apt-get install -y debhelper build-essential devscripts
      build-command: make deb
