on:
  push:
    # Sequence of patterns matched against refs/tags
    tags:
    - 'v*' # Push events to matching v*, i.e. v1.0, v20.15.10

  workflow_dispatch:

name: Build Release

jobs:
  deb-package:
    name: build DEB-Package
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Install dependencies
        run: sudo apt update && sudo apt install debhelper build-essential devscripts -y

      - name: Check the tag against debian/changelog
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          # git refuses ':' and '~' in a refname, so the tag spells the version
          # without the epoch and with a dash: 1:7.4.24~edu -> v7.4.24-edu.
          VERSION="$(dpkg-parsechangelog -S Version)"
          EXPECTED="v$(echo "${VERSION#*:}" | tr '~' '-')"
          if [ "$GITHUB_REF_NAME" != "$EXPECTED" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match debian/changelog ($VERSION). Tag the release as $EXPECTED."
            exit 1
          fi

      - name: Build
        run: make deb # sophomorix package build command

      - name: Copy artifacts
        run: mkdir package && cp ../sophomorix-* ./package && cp ../sophomorix4_* ./package

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: deb-package
          path: package/*
        
  github-release:
    needs: deb-package
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/')
    name: GitHub Release
    runs-on: ubuntu-24.04
    # The repository's default GITHUB_TOKEN permission is read, and creating
    # a release needs write. Asking for it here keeps the grant on the job
    # that needs it instead of loosening the default for every workflow.
    permissions:
      contents: write
    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: deb-package

      - name: Extract current changes
        run: cat *.changes | sed '0,/^Changes:$/d' | sed '/Checksums.*/Q' | sed '1,2d' | tail >> ./current-changes

      - name: Define distribution variables
        run: |
          export DISTRIBUTION=$(grep -i ^Distribution *.changes | awk -F\: '{ print $2 }' | awk '{ print $1 }')
          echo "DISTRIBUTION=$DISTRIBUTION" >> $GITHUB_ENV

          # The epoch in "Version: 1:x.y.z" contains the field separator.
          export VERSION=$(grep -i ^Version *.changes | head -n1 | sed 's/^[Vv]ersion:[[:space:]]*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Test if it's a testing prerelease
        id: check_prerelease
        uses: haya14busa/action-cond@v1
        with:
          cond: ${{ env.DISTRIBUTION == 'lmn72' }}
          if_true: "true"
          if_false: "false"

      - name: Create Release
        id: create_release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.ref }}
          release_name: Release ${{ env.VERSION }} (${{ env.DISTRIBUTION }})
          draft: false
          prerelease: ${{ steps.check_prerelease.outputs.value }}
          body_path: ./current-changes

      - name: Delete current changes file
        run: rm ./current-changes

      - name: Upload Release Assets
        id: upload-release-assets
        uses: dwenegar/upload-release-assets@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          release_id: ${{ steps.create_release.outputs.id }}
          assets_path: .

  publish:
    needs: deb-package
    name: Push latest release to archive repo
    if: github.event_name == 'push' && contains(github.ref, 'refs/tags/') && github.repository == 'edulution-io/sophomorix4'
    runs-on: ubuntu-latest
    # Holds the package server's deploy key and admits v* tags only, so a run
    # on any branch cannot read the key.
    environment: package-server
    steps:
      - name: Setup SSH Key
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
          PACKAGESERVER_PRIVATE_KEY: ${{ secrets.PACKAGESERVER_PRIVATE_KEY }}
        run: |
          ssh-agent -a $SSH_AUTH_SOCK > /dev/null
          ssh-add - <<< "$PACKAGESERVER_PRIVATE_KEY"
          
      - name: Clone archive repo
        uses: actions/checkout@v3
        with: 
          repository: "edulution-io/edulution-package-server"
          ssh-key: ${{ secrets.PACKAGESERVER_PRIVATE_KEY }}
          path: "./deb"
          
      - name: Prepare download
        run: mkdir "package"
          
      - name: Download artifact
        uses: actions/download-artifact@v4.1.7
        with:
          name: deb-package
          path: "./package"
          
      - name: Prepare environment
        run: |
          export PACKAGE=$(grep -i ^Source package/*.changes | awk -F\: '{ print $2 }' | awk '{ print $1 }')
          echo "PACKAGE=$PACKAGE" >> $GITHUB_ENV
          
          export DISTRIBUTION=$(grep -i ^Distribution package/*.changes | awk -F\: '{ print $2 }' | awk '{ print $1 }')
          echo "DISTRIBUTION=$DISTRIBUTION" >> $GITHUB_ENV
          
          # The epoch in "Version: 1:x.y.z" carries a colon, so the field
          # separator ':' would cut the version down to the epoch.
          export VERSION=$(grep -i ^Version package/*.changes | head -n1 | sed 's/^[Vv]ersion:[[:space:]]*//')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          
          # The package server's suites are Ubuntu codenames, the changelog
          # keeps the linuxmuster generation. Only 7.4 on Ubuntu 26.04 is
          # maintained, so anything else is a mistake and must not be
          # published to the wrong suite.
          case "$DISTRIBUTION" in
            lmn74) CODENAME="resolute" ;;
            *) echo "Unexpected distribution '$DISTRIBUTION' in debian/changelog" >&2
               exit 1 ;;
          esac
          echo "CODENAME=$CODENAME" >> $GITHUB_ENV

          # A branch name may not contain ':' or '~', and the fork version
          # carries both: the epoch and the ~edu suffix.
          export BRANCH_NAME=$(echo "$PACKAGE-$CODENAME-$VERSION" | tr ':~' '--')
          echo "BRANCH_NAME=$BRANCH_NAME" >> $GITHUB_ENV
 
      - name: Copy packages
        run: |
          mkdir -p deb/packages/$PACKAGE/$CODENAME
          # Only the package files: anything else in the directory belongs to the
          # package server.
          rm -f "deb/packages/$PACKAGE/$CODENAME/"*.deb "deb/packages/$PACKAGE/$CODENAME/"*.changes "deb/packages/$PACKAGE/$CODENAME/"*.buildinfo "deb/packages/$PACKAGE/$CODENAME/"*.dsc "deb/packages/$PACKAGE/$CODENAME/"*.tar.*

          cp package/* deb/packages/$PACKAGE/$CODENAME
          
      - name: Push to repo
        env:
          SSH_AUTH_SOCK: /tmp/ssh_agent.sock
        run: |
          cd deb
          git config user.name github-actions
          git config user.email github-actions@github.com
          git checkout -b update/$BRANCH_NAME
          git add *
          git commit -a -m "Update $PACKAGE/$CODENAME to $VERSION (By GitHub actions)"
          git push --set-upstream origin update/$BRANCH_NAME
